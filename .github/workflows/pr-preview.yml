name: PR Preview

# Deploys a throwaway copy of the stack per pull request, on stage
# `pr-<branch>`. Because that stage name starts with `pr-`, backend/src/Db.ts
# resolves Postgres via `Neon.Project.ref("app-db", { stage: "staging" })`
# instead of creating a project — every preview branches the *staging*
# project's database. The `staging` stage must therefore already be deployed,
# or the ref has nothing to resolve against.
#
# This repo is public, which makes Actions logs public too. Account id and
# workers.dev subdomain are stored as secrets rather than vars purely so
# GitHub masks them: `alchemy deploy` prints the deployed URLs to stdout, and
# masking is what keeps those out of a world-readable log. For the same reason
# this workflow does not comment preview URLs on the PR — masking applies to
# log output, not to API payloads, so a comment would publish the subdomain in
# plain text. Derive a preview URL locally instead:
#   https://lastreia-alchemy-web-<stage>.<subdomain>.workers.dev

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Never let two runs mutate the same stage's state concurrently — the shared
# Cloudflare state store locks per stack+stage. Queue instead of cancelling,
# so a cancelled run can't leave a half-applied stage behind.
concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    # Forked PRs never receive secrets in a public repo, so a preview deploy
    # from a fork would fail with empty credentials rather than do anything
    # useful. Skip it. Do NOT "fix" this by switching to pull_request_target:
    # that runs with secrets available to untrusted fork code.
    #
    # Dependabot is excluded for the same reason — its runs read a separate
    # Dependabot secrets store, not these secrets — and because its branch
    # names (dependabot/npm_and_yarn/<dir>/<group>) blow past the 42-char
    # stage limit anyway. Dependency PRs still get the full ci.yml checks.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Requires bun.lock to be committed; it also pins the alchemy patch in
      # patches/, which the build depends on.
      - run: bun install --frozen-lockfile

      - name: Resolve stage
        id: stage
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Identical transform to the dev:branch/deploy:branch scripts in
          # package.json, but derived from github.head_ref: actions/checkout
          # leaves a detached HEAD, so `git branch --show-current` is empty.
          stage="pr-$(printf '%s' "$HEAD_REF" | tr '[:upper:]/_' '[:lower:]--' | tr -cd 'a-z0-9-')"
          # Workers are named `lastreia-alchemy-web-<stage>` and that name is a
          # DNS label on workers.dev, capped at 63 chars. The 21-char prefix
          # leaves 42 for the stage. Fail loudly rather than truncating, which
          # would silently collide two branches onto one stage.
          if [ ${#stage} -gt 42 ]; then
            echo "::error::Branch name too long: stage '$stage' is ${#stage} chars (max 42). Rename the branch to deploy a preview."
            exit 1
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: bunx alchemy deploy --stage "${{ steps.stage.outputs.stage }}" --yes
