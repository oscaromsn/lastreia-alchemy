version: 2

# Without this file, Dependabot falls back to the npm_and_yarn ecosystem: it
# edits package.json but leaves bun.lock untouched, so every dependency PR
# fails ci.yml at `bun install --frozen-lockfile` with "lockfile had changes,
# but lockfile is frozen". The bun ecosystem updates the lockfile too.
updates:
  - package-ecosystem: "bun"
    # The workspace root — bun.lock covers backend, frontend and
    # packages/desktop from here.
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per batch instead of one per dependency: each PR costs a full CI
    # run. Restricted to minor/patch so a batch stays reviewable.
    groups:
      safe-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # These are pinned to exact pre-release versions on purpose: they move in
      # lockstep with application code, so every bump is a migration rather
      # than an update, and `alchemy` additionally keys the patches/ entry in
      # package.json by exact version — bumping it orphans the patch silently.
      # Dependabot's first grouped attempt bumped all of them at once and
      # produced 137 typecheck errors. Upgrade them deliberately instead.
      - dependency-name: "alchemy"
      - dependency-name: "effect"
      - dependency-name: "@effect/*"
      - dependency-name: "foldkit"
      - dependency-name: "@foldkit/*"
      - dependency-name: "drizzle-orm"
      - dependency-name: "drizzle-kit"
      # Majors anywhere else still need a human: this batch also carried
      # TypeScript 5 -> 7 and @cloudflare/workers-types 4 -> 5.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # The Tauri desktop shell. Its Cargo.toml lives beside the lockfile, not at
  # the repo root, so the directory must point at the crate itself.
  #
  # Caveat worth knowing before trusting a green check on these PRs: ci.yml
  # builds only the TypeScript side, so nothing here compiles Rust. A cargo PR
  # can pass CI without the desktop app having been built at all. Building
  # Tauri on ubuntu needs the webkit2gtk/gtk system packages installed first.
  - package-ecosystem: "cargo"
    directory: "/packages/desktop/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Majors need a human, same as the bun ecosystem above.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
